<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>blog</title>
</head>

<body>

    <aside class="sidebar" th:fragment="sidebar">
        <h2>Menu</h2>
        <ul>
            <li><a href="/">ホーム</a></li>
            <li><a href="/profile">プロフィール</a></li>
        </ul>
    </aside>

    <header class="header" th:fragment="header">
        <div class="logo">
            <h1>Spring</h1>
        </div>

        <div class="search-area">
            <input type="search" placeholder="キーワード検索">
        </div>

        <div class="post-area">
            <a href="/blogs/new" class="post-btn">投稿</a>
        </div>
    </header>

    <main class="content">

        <div th:each="blog : ${blogs}" class="article-card">

            <a th:href="@{/blogs/{id}(id=${blog.id})}">
                <h2 th:text="${blog.title}"></h2>
            </a>

            <p th:text="${blog.content}"></p>

        </div>

    </main>

</body>

</html>

</html>
